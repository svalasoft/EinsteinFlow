name: EinsteinFlow
options:
  bundleIdPrefix: com.skelmir
  developmentRegion: en
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: NS5WB6U6X9
targets:
  EinsteinFlow:
    type: application
    platform: iOS
    sources:
      - path: EinsteinFlow
        excludes:
          - '*.sksl'
      # ShaderLibrary.default resolves a basename at the bundle root on Svala.
      - path: EinsteinFlow/einsteinFlow.sksl
        buildPhase: resources
    settings:
      base:
        # Content assets are present, but this example does not declare AppIcon.
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        CODE_SIGN_IDENTITY: Apple Development
        INFOPLIST_FILE: EinsteinFlow/Info.plist
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: true
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: '1.0'
        PRODUCT_BUNDLE_IDENTIFIER: com.skelmir.EinsteinFlow
        PRODUCT_NAME: EinsteinFlow
        ENABLE_USER_SCRIPT_SANDBOXING: true
schemes:
  EinsteinFlow:
    build:
      targets:
        EinsteinFlow: all
